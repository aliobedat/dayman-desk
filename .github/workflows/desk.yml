name: desk

on:
  push:
    branches: ['**']
    paths: ['desk/**', '.github/workflows/desk.yml']
    tags: ['desk-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # WO-103: pinned; VS 2026 (MSVC 14.50+) on newer images no longer targets Windows 7.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The SDK builds both the net8 tests and the net48 program (reference assemblies from NuGet).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests (Core)
        run: dotnet run --project desk/tests/DaymanDesk.Tests -c Release

      # WO-95: tessdata_fast (Arabic + English), embedded in the exe; not kept in git.
      - name: OCR data
        shell: pwsh
        run: |
          $d = "desk/src/DaymanDesk.App/tessdata"
          New-Item -ItemType Directory -Force $d | Out-Null
          foreach ($l in "ara", "eng") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/$l.traineddata" -OutFile "$d/$l.traineddata"
            Write-Host "$l $((Get-Item "$d/$l.traineddata").Length) bytes"
          }

      # WO-98: IBM Plex Sans Arabic (SIL OFL 1.1) 400 and 600, embedded in the exe; not kept in git.
      - name: UI font
        shell: pwsh
        run: |
          $d = "desk/src/DaymanDesk.App/fonts"
          New-Item -ItemType Directory -Force $d | Out-Null
          # Pinned google/fonts commit and the expected SHA-256 of each file.
          $commit = "6ebe737e44fd64ee736bbc6feed6136a6dbfd222"
          $want = @{
            "IBMPlexSansArabic-Regular.ttf"  = "6f611412270a132bbac838da9259d4c68569b4175f3b3b8fa3fa36a30b56dab9"
            "IBMPlexSansArabic-SemiBold.ttf" = "597bd5502e5997be4414e4c9c88834b30ff3784250c84f20bce2b20e53ebd467"
            "OFL.txt"                        = "7e6b2818edbd8f6a01ae80641cc8f16a51080d08fb4e532be3a0b6f74adb07da"
          }
          foreach ($f in $want.Keys) {
            Invoke-WebRequest "https://raw.githubusercontent.com/google/fonts/$commit/ofl/ibmplexsansarabic/$f" -OutFile "$d/$f"
            $h = (Get-FileHash "$d/$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($h -ne $want[$f]) { throw "$f SHA-256 mismatch: $h" }
            Write-Host "$f $((Get-Item "$d/$f").Length) bytes, SHA-256 ok"
          }

      # WO-95b: the VC++ 2015-2022 runtime and the UCRT, shipped app-local next to the OCR natives (a bare Windows 7).
      - name: VC++ runtime
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\Redist"
          foreach ($a in "x64", "x86") {
            $dst = "desk/src/DaymanDesk.App/vcrt/$a"
            New-Item -ItemType Directory -Force $dst | Out-Null
            # Only the VS 2022 (VC143) runtime: the VS 2026 one (14.50+) drops Windows 7.
            $crt = @(Get-ChildItem "$vs\VC\Redist\MSVC\*\$a\Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue) | Sort-Object FullName | Select-Object -Last 1
            if (-not $crt) { throw "no VC143 redist for $a" }
            foreach ($f in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") { if (Test-Path "$($crt.FullName)\$f") { Copy-Item "$($crt.FullName)\$f" $dst } }
            # WO-103: the app-local UCRT from an older SDK (10.0.26100 is not promised to run on Windows 7).
            $ucrt = @("10.0.19041.0", "10.0.22621.0", "10.0.17763.0" | ForEach-Object { "$kits\$_\ucrt\DLLs\$a" } | Where-Object { Test-Path $_ }) | Select-Object -First 1
            if (-not $ucrt) { Get-ChildItem $kits -Directory | ForEach-Object { Write-Host "  SDK redist $($_.Name)" }; throw "no Windows 7 UCRT redist (19041, 22621, 17763) for $a" }
            $ucrt = Get-Item $ucrt
            Copy-Item "$($ucrt.FullName)\*.dll" $dst
            if (-not (Test-Path "$dst\ucrtbase.dll") -or -not (Test-Path "$dst\vcruntime140.dll")) { throw "runtime incomplete for $a" }
            $vc = (Get-Item "$dst\vcruntime140.dll").VersionInfo
            if ($vc.FileMajorPart -ne 14 -or $vc.FileMinorPart -ge 50) { throw "VC runtime $($vc.FileVersion) drops Windows 7" }
            Write-Host "$a : vcruntime140 $($vc.FileVersion), ucrtbase $((Get-Item "$dst\ucrtbase.dll").VersionInfo.FileVersion)"
            Write-Host "$a : $($crt.FullName) + $($ucrt.FullName), $((Get-ChildItem $dst).Count) files"
          }

      # WO-95: .NET Framework 4.8 (Windows 7 SP1 to 11); Costura merges the managed DLLs into one exe.
      - name: Build DaymanDesk.exe
        shell: powershell
        run: |
          dotnet build desk/src/DaymanDesk.App -c Release
          New-Item -ItemType Directory -Force desk/publish | Out-Null
          Copy-Item desk/src/DaymanDesk.App/bin/Release/net48/DaymanDesk.exe desk/publish/DaymanDesk.exe
          $exe = Get-Item desk/publish/DaymanDesk.exe
          Write-Host "DaymanDesk.exe $([math]::Round($exe.Length / 1MB, 1)) MB"
          $names = [Reflection.Assembly]::LoadFile($exe.FullName).GetManifestResourceNames()
          $names | Where-Object { $_ -like 'ocr/*' } | ForEach-Object { Write-Host "  $_" }
          foreach ($want in 'ocr/tessdata/ara.traineddata', 'ocr/tessdata/eng.traineddata') { if ($names -notcontains $want) { throw "missing resource $want" } }
          if (-not ($names | Where-Object { $_ -like 'ocr/x64/tesseract*.dll' })) { throw "missing native tesseract (x64)" }
          if (-not ($names | Where-Object { $_ -like 'ocr/x86/tesseract*.dll' })) { throw "missing native tesseract (x86)" }

      # WO-95b: the bundled OCR reads a synthetic receipt (both reads must give the invoice number and the total).
      - name: OCR self-test
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $png = Join-Path $pwd "desk/ocr-selftest.png"
          $bmp = New-Object System.Drawing.Bitmap 576, 420
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::White)
          $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::SingleBitPerPixelGridFit
          $font = New-Object System.Drawing.Font "Arial", 20
          $y = 10
          foreach ($l in "JAMRA RESTAURANT", "Invoice No: 10432", "Date 19/11/2026 18:02", "Burger x2        8.000", "Grand Total     12.500 JOD", "Thank you") {
            $g.DrawString($l, $font, [System.Drawing.Brushes]::Black, 10, $y); $y += 60
          }
          $g.Dispose(); $bmp.Save($png, [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process desk/publish/DaymanDesk.exe -ArgumentList '--ocr-selftest', "`"$png`"" -PassThru -Wait
          Write-Host "self-test: exit $($p.ExitCode) in $($sw.ElapsedMilliseconds) ms (first run includes the extraction)"
          Get-Content "$png.txt"
          if ($p.ExitCode -ne 0) { throw "OCR self-test failed" }
          if (-not ((Get-Content "$png.txt" -Raw) -match 'invoice 10432/10432 total 12\.5')) { throw "OCR read the wrong numbers" }

      # WO-95b: key, DPAPI seal, P1363 signature and SPKI verify on .NET Framework.
      - name: Signing self-test
        shell: powershell
        run: |
          $out = Join-Path $pwd "desk/sign-selftest.txt"
          $p = Start-Process desk/publish/DaymanDesk.exe -ArgumentList '--sign-selftest', "`"$out`"" -PassThru -Wait
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "signing self-test failed" }

      # WO-96: the update signature path on .NET Framework, with a throwaway key made here (the real key is not needed).
      - name: Update self-test
        shell: pwsh
        run: |
          $k = [Security.Cryptography.ECDsa]::Create([Security.Cryptography.ECCurve+NamedCurves]::nistP256)
          $exe = Join-Path $pwd "desk/publish/DaymanDesk.exe"
          $t = Join-Path $env:RUNNER_TEMP "update-selftest.exe"
          Copy-Item $exe $t
          $sig = $k.SignData([IO.File]::ReadAllBytes($t), [Security.Cryptography.HashAlgorithmName]::SHA256)
          [IO.File]::WriteAllText("$t.sig", [Convert]::ToBase64String($sig))
          $env:DESK_UPDATE_TEST_SPKI = [Convert]::ToBase64String($k.ExportSubjectPublicKeyInfo())
          $out = Join-Path $env:RUNNER_TEMP "update-selftest.txt"
          $p = Start-Process $exe -ArgumentList '--update-selftest', "`"$t`"", "`"$out`"" -PassThru -Wait
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "update self-test failed" }

      # WO-96: master and desk-v tags sign the exe for the silent update (DaymanDesk.exe.sig: base64 P1363, ECDSA P-256,
      # SHA-256) and check it against the key built into the program. No secret: a warning, no .sig.
      - name: Sign for auto-update
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/desk-v')
        shell: pwsh
        env:
          DESK_UPDATE_KEY: ${{ secrets.DESK_UPDATE_KEY }}
        run: |
          if (-not $env:DESK_UPDATE_KEY) { Write-Host "::warning::DESK_UPDATE_KEY is not set: the release has no DaymanDesk.exe.sig, shops will not update by themselves"; exit 0 }
          $exe = Join-Path $pwd "desk/publish/DaymanDesk.exe"
          $k = [Security.Cryptography.ECDsa]::Create()
          $n = 0
          $k.ImportPkcs8PrivateKey([Convert]::FromBase64String($env:DESK_UPDATE_KEY), [ref]$n)
          $env:DESK_UPDATE_KEY = $null
          $sig = $k.SignData([IO.File]::ReadAllBytes($exe), [Security.Cryptography.HashAlgorithmName]::SHA256)
          $k.Dispose()
          [IO.File]::WriteAllText("$exe.sig", [Convert]::ToBase64String($sig))
          $out = Join-Path $env:RUNNER_TEMP "update-verify.txt"
          $p = Start-Process $exe -ArgumentList '--update-selftest', "`"$exe`"", "`"$out`"" -PassThru -Wait
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "the signature does not verify with the key built into the program (wrong DESK_UPDATE_KEY?)" }

      - name: Version and SHA256
        id: meta
        shell: pwsh
        run: |
          $exe = "desk/publish/DaymanDesk.exe"
          $v = (Get-Item $exe).VersionInfo.ProductVersion -replace '\+.*$', ''
          $want = ([xml](Get-Content desk/src/DaymanDesk.App/DaymanDesk.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($v -ne $want) { throw "exe version $v does not match csproj $want" }
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  DaymanDesk.exe" | Out-File -Encoding ascii -NoNewline desk/publish/DaymanDesk.exe.sha256
          Copy-Item desk/REPORT.md desk/publish/REPORT.md
          "version=$v" >> $env:GITHUB_OUTPUT
          "sha=$h" >> $env:GITHUB_OUTPUT
          Write-Host "DaymanDesk $v  sha256 $h"

      # WO-103: DaymanDeskSetup.exe, the one download for shops: native (MSVC, static CRT, x86, no runtime needed),
      # embedding this exact DaymanDesk.exe (the one released next to its .sig). See desk/setup/setup.cpp.
      - name: Setup build environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vi = (Get-Item desk/publish/DaymanDesk.exe).VersionInfo
          "DESK_VCVARS=$vs\VC\Auxiliary\Build\vcvarsall.bat" >> $env:GITHUB_ENV
          # VS 2026 (MSVC 14.5x) dropped Windows 7 targeting: build with the VS 2022 toolset (14.4x) when it is installed.
          $tools = @(Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Select-Object -ExpandProperty Name)
          Write-Host "MSVC toolsets: $($tools -join ', ')"
          $v143 = $tools | Where-Object { $_ -like '14.4*' -or $_ -like '14.3*' } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $v143) { throw "no MSVC 14.3x/14.4x toolset: 14.50+ drops Windows 7" }
          "DESK_VCVER=-vcvars_ver=$v143" >> $env:GITHUB_ENV
          "DESK_DEFS=/DDESK_V1=$($vi.FileMajorPart) /DDESK_V2=$($vi.FileMinorPart) /DDESK_V3=$($vi.FileBuildPart) /DDESK_V4=$($vi.FilePrivatePart)" >> $env:GITHUB_ENV

      - name: Build DaymanDeskSetup.exe
        shell: cmd
        working-directory: desk/setup
        run: |
          call "%DESK_VCVARS%" x86 %DESK_VCVER% >nul || exit /b 1
          cl /c /O1 /MT /GS /W4 /utf-8 /DUNICODE /D_UNICODE %DESK_DEFS% setup.cpp || exit /b 1
          rc /nologo /fo setup.res setup.rc || exit /b 1
          link /nologo /OUT:..\publish\DaymanDeskSetup.exe /SUBSYSTEM:WINDOWS,6.00 /MANIFEST:NO /DYNAMICBASE /NXCOMPAT setup.obj setup.res winhttp.lib wintrust.lib crypt32.lib comctl32.lib shell32.lib advapi32.lib user32.lib gdi32.lib version.lib delayimp.lib /DELAYLOAD:version.dll /DELAYLOAD:winhttp.dll /DELAYLOAD:wintrust.dll /DELAYLOAD:crypt32.dll || exit /b 1
          rem Windows 7 has no api-ms-win-* DLLs and none of these Windows 8+ functions: a static import of one would stop the setup there.
          dumpbin /nologo /imports ..\publish\DaymanDeskSetup.exe > imports.txt || exit /b 1
          findstr /i /r "^ *[a-z0-9_-]*\.dll" imports.txt
          findstr /i "api-ms-win GetSystemTimePreciseAsFileTime CreateFile2 GetCurrentPackageId WakeByAddress WaitOnAddress" imports.txt && exit /b 1
          exit /b 0

      # WO-103: a dry run on the runner (prints the plan, changes nothing), then the real .NET 4.8 download over WinHTTP
      # and its Microsoft signature check (the runner already has 4.8, so nothing is run).
      - name: Setup smoke run
        shell: pwsh
        run: |
          $exe = (Resolve-Path desk/publish/DaymanDeskSetup.exe).Path
          # Windows 7 refuses an exe that asks for a newer OS or subsystem version in its PE header.
          $b = [IO.File]::ReadAllBytes($exe)
          $opt = [BitConverter]::ToInt32($b, 0x3c) + 24
          $os = [BitConverter]::ToUInt16($b, $opt + 40); $sub = [BitConverter]::ToUInt16($b, $opt + 48)
          Write-Host "DaymanDeskSetup.exe $([math]::Round($b.Length / 1MB, 1)) MB, PE OS version $os.x, subsystem $sub.x"
          if ($os -gt 6 -or $sub -gt 6) { throw "DaymanDeskSetup.exe would not start on Windows 7" }
          foreach ($a in '--check', '--check-download') {
            $psi = New-Object Diagnostics.ProcessStartInfo $exe, $a
            $psi.UseShellExecute = $false; $psi.RedirectStandardOutput = $true
            $p = [Diagnostics.Process]::Start($psi)
            $o = $p.StandardOutput.ReadToEnd(); $p.WaitForExit()
            Write-Host "== DaymanDeskSetup $a (exit $($p.ExitCode))"; Write-Host $o
            if ($p.ExitCode -ne 0) { throw "DaymanDeskSetup $a failed" }
            if ($o -notmatch 'install: .*embedded') { throw "DaymanDeskSetup $a printed no plan" }
          }
          # The embedded Microsoft root must be the very one in the runner's store; both download ways must verify.
          if ($o -notmatch 'Microsoft Root Certificate Authority 2011: SHA-256 ok, in LocalMachine') { throw "embedded Microsoft root differs from the runner's" }
          if ($o -notmatch 'https: ok' -or $o -notmatch 'http: ok') { throw "a .NET 4.8 download way failed" }
          if (([regex]::Matches($o, 'signer "Microsoft Corporation" -> trusted')).Count -ne 2) { throw "the .NET 4.8 installer did not verify" }
          if (([regex]::Matches($o, 'SHA-256 [0-9a-f]{64} -> the pinned file')).Count -ne 2) { throw "the .NET 4.8 installer is not the pinned file" }

      - name: Screenshots of the Arabic UI (review only)
        continue-on-error: true
        shell: pwsh
        run: |
          # WO-91: render as on a shop PC with an Arabic locale and native (national) digits, so digits.png and the
          # windows show whether the UI keeps 0-9.
          Set-Culture ar-SA
          Add-Type -Namespace Nls -Name K -MemberDefinition '[DllImport("kernel32.dll", CharSet = CharSet.Unicode)] public static extern bool SetLocaleInfoW(uint lcid, uint type, string data); [DllImport("kernel32.dll", CharSet = CharSet.Unicode)] public static extern int GetLocaleInfoW(uint lcid, uint type, System.Text.StringBuilder data, int size);'
          [void][Nls.K]::SetLocaleInfoW(0x400, 0x1014, "2")  # LOCALE_USER_DEFAULT, LOCALE_IDIGITSUBSTITUTION = national
          $sb = New-Object System.Text.StringBuilder 16
          [void][Nls.K]::GetLocaleInfoW(0x400, 0x1014, $sb, 16)
          Write-Host "user locale $((Get-Culture).Name), digit substitution $sb"
          $dir = Join-Path $pwd "desk/shots"
          $p = Start-Process desk/publish/DaymanDesk.exe -ArgumentList '--screenshots', "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "screenshots timed out" }
          Get-ChildItem $dir | Format-Table Name, Length
          if (Test-Path "$dir/error.txt") { Get-Content "$dir/error.txt"; throw "screenshots failed" }
          # Also in the log (base64, 3000-char lines) for reviewers who cannot download artifacts.
          foreach ($f in Get-ChildItem "$dir/*.png") {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            for ($i = 0; $i -lt $b.Length; $i += 3000) { Write-Host ("SHOT {0} {1}" -f $f.Name, $b.Substring($i, [Math]::Min(3000, $b.Length - $i))) }
          }

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: DaymanDesk-screenshots
          path: desk/shots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: DaymanDesk
          path: |
            desk/publish/DaymanDeskSetup.exe
            desk/publish/DaymanDesk.exe
            desk/publish/DaymanDesk.exe.sha256
            desk/publish/DaymanDesk.exe.sig
            desk/publish/REPORT.md
          if-no-files-found: error

      - name: Latest build (desk-latest prerelease, every green master build)
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="desk/publish/DaymanDeskSetup.exe desk/publish/DaymanDesk.exe desk/publish/DaymanDesk.exe.sha256 desk/publish/REPORT.md"
          if [ -f desk/publish/DaymanDesk.exe.sig ]; then files="$files desk/publish/DaymanDesk.exe.sig"; fi
          gh release delete desk-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create desk-latest $files \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "دايماً ديسك ${{ steps.meta.outputs.version }} (آخر نسخة)" \
            --notes "الإصدار ${{ steps.meta.outputs.version }}، آخر بناء ناجح من master (${GITHUB_SHA::7}). SHA256: ${{ steps.meta.outputs.sha }}. التثبيت والاختبار: REPORT.md"

      - name: Prerelease
        if: startsWith(github.ref, 'refs/tags/desk-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="desk/publish/DaymanDeskSetup.exe desk/publish/DaymanDesk.exe desk/publish/DaymanDesk.exe.sha256 desk/publish/REPORT.md"
          if [ -f desk/publish/DaymanDesk.exe.sig ]; then files="$files desk/publish/DaymanDesk.exe.sig"; fi
          gh release create "$GITHUB_REF_NAME" $files \
            --repo "$GITHUB_REPOSITORY" --prerelease --title "دايماً ديسك $GITHUB_REF_NAME" \
            --notes "نسخة تجريبية من دايماً ديسك. التثبيت والاختبار: desk/REPORT.md"
