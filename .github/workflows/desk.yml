name: desk

on:
  push:
    branches: ['**']
    paths: ['desk/**', '.github/workflows/desk.yml']
    tags: ['desk-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests (Core)
        run: dotnet run --project desk/tests/DaymanDesk.Tests -c Release

      - name: Publish DaymanDesk.exe
        run: >
          dotnet publish desk/src/DaymanDesk.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o desk/publish

      - uses: actions/upload-artifact@v4
        with:
          name: DaymanDesk
          path: desk/publish/DaymanDesk.exe
          if-no-files-found: error

      - name: Latest build (desk-latest prerelease, every green master build)
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desk-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create desk-latest desk/publish/DaymanDesk.exe --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "دايماً ديسك (آخر نسخة)" \
            --notes "آخر بناء ناجح من master (${GITHUB_SHA::7}). التثبيت والاختبار: desk/REPORT.md"

      - name: Prerelease
        if: startsWith(github.ref, 'refs/tags/desk-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" desk/publish/DaymanDesk.exe
          --repo "$GITHUB_REPOSITORY" --prerelease --title "دايماً ديسك $GITHUB_REF_NAME"
          --notes "نسخة تجريبية من دايماً ديسك. التثبيت والاختبار: desk/REPORT.md"
